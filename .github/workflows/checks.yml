name: checks

# Runs on the three platforms deliberately. Until this existed, the `cfg(not(unix))` branches in
# `vault/storage.rs` and the Windows clipboard path had never been compiled anywhere, let alone
# executed — every check had run on one developer's Mac.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Not fail-fast: when a platform-specific branch breaks, the useful information is which
      # platforms broke, not just the first one to report.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `tauri::generate_context!` embeds the built frontend, so the Rust crate does not compile
      # without it — not even to run its own unit tests.
      - run: npm ci
      - run: npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Integration test binaries are built into `target/debug/deps`, but tauri's build script
      # leaves `WebView2Loader.dll` in `target/debug`. Windows resolves a DLL from the directory
      # of the executable that needs it, so from `deps/` the loader is invisible and the test
      # process dies at load time with STATUS_ENTRYPOINT_NOT_FOUND before a single test runs.
      # The listing stays so the next person sees what is actually there rather than guessing.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-run
          Get-ChildItem src-tauri\target\debug\*.dll | Select-Object -ExpandProperty Name
          $env:PATH = "$PWD\src-tauri\target\debug;$env:PATH"
          cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit

      # Installed and invoked explicitly rather than through an action that looks for a lockfile
      # at the repository root. This is not a workspace — the lockfile lives in `src-tauri/`, and
      # an action that fails to find it would report success having audited nothing.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: cargo audit --file src-tauri/Cargo.lock
